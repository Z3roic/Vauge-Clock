      make: (r) => `${r() < 0.75 ? pick(r, APPROX) + ' ' : ''}${pick(r, CLOCK_THINGS)} o'clock`,
    },
    {
      weight: 12,
      count: () => (APPROX.length + 1) * POSITIONS.length * EVENTS.length,
      make: (r) => `${r() < 0.4 ? pick(r, APPROX) + ' ' : ''}${pick(r, POSITIONS)} ${pick(r, EVENTS)}`,
    },
    {
      weight: 15,
      count: () => TOO_INTENSITY.length * TOO_ADJ.length * TOO_DEGREE.length * TOO_STATES.length,
      make: (r) => `${pick(r, TOO_INTENSITY)} ${pick(r, TOO_ADJ)} to be ${pick(r, TOO_DEGREE)} ${pick(r, TOO_STATES)}`,
    },
    {
      weight: 5,
      count: () => ADVERBS.length * DAYPARTS.length * FORMS.length,
      make: (r) => `${pick(r, ADVERBS)} ${pick(r, DAYPARTS)}${pick(r, FORMS)}`,
    },
    {
      weight: 27,
      count: () => NUMBERS.length * UNITS.length * DIRECTIONS.length * EVENTS.length,
      make: (r) => `${pick(r, NUMBERS)} ${pick(r, UNITS)} ${pick(r, DIRECTIONS)} ${pick(r, EVENTS)}`,
    },
    {
      weight: 12,
      count: () => PART_ADJECTIVES.length * PART_NOUNS.length * PART_SCOPES.length,
      make: (r) => `the ${pick(r, PART_ADJECTIVES)} ${pick(r, PART_NOUNS)} of ${pick(r, PART_SCOPES)}`,
    },
    {
      weight: 10,
      count: () => EVENTS.length * (EVENTS.length - 1) * BETWEEN.length,
      make: (r) => {
        const a = pick(r, EVENTS);
        let b = pick(r, EVENTS);
        while (b === a) b = pick(r, EVENTS);
        return pick(r, BETWEEN)(a, b);
      },
    },
    {
      weight: 4,
      count: () => (APPROX.length + 1) * VAGUE_TIMES.length,
      make: (r) => `${r() < 0.5 ? pick(r, APPROX) + ' ' : ''}${pick(r, VAGUE_TIMES)}`,
    },
  ];
  const FAMILY_WEIGHT = FAMILIES.reduce((s, f) => s + f.weight, 0);

  function pickFamily(r) {
    let x = r() * FAMILY_WEIGHT;
    for (const f of FAMILIES) { x -= f.weight; if (x < 0) return f; }
    return FAMILIES[0];
  }

  function daypartIndex(h) {
    if (h < 5) return 0;
    if (h < 8) return 1;
    if (h < 12) return 2;
    if (h < 14) return 3;
    if (h < 17) return 4;
    if (h < 20) return 5;
    if (h < 23) return 6;
    return 7;
  }
  function minuteIndex(m) {
    if (m < 8) return 0;
    if (m < 23) return 1;
    if (m < 38) return 2;
    if (m < 53) return 3;
    return 4;
  }

  function generate(r, date) {
    const roll = r();
    let base;
    if (roll < 0.24) base = pick(r, DAYPART_PHRASES[daypartIndex(date.getHours())]);
    else if (roll < 0.30) base = pick(r, WEEKDAY_PHRASES[date.getDay()]);
    else if (roll < 0.36) base = pick(r, MINUTE_PHRASES[minuteIndex(date.getMinutes())]);
    else if (roll < 0.56) base = pick(r, GEMS);
    else base = pickFamily(r).make(r);

    if (base.length <= 42) {
      const first = base.split(' ')[0].replace(/,$/, '');
      if (r() < 0.22 && !ADVERB_SET.has(first)) base = `${pick(r, PREFIXES)} ${base}`;
      if (base.length <= 52 && r() < 0.22) {
        let suffix = pick(r, SUFFIXES);
        while (suffix.charAt(0) === '-' && /(ish|y|adjacent|esque|like|shaped|coded|flavored)$/.test(base)) suffix = pick(r, SUFFIXES);
        base += suffix;
      }
    }
    return base;
  }

  const baseTotal =
    GEMS.length +
    DAYPART_PHRASES.reduce((s, a) => s + a.length, 0) +
    WEEKDAY_PHRASES.reduce((s, a) => s + a.length, 0) +
    MINUTE_PHRASES.reduce((s, a) => s + a.length, 0) +
    FAMILIES.reduce((s, f) => s + f.count(), 0);

  const total = baseTotal * (PREFIXES.length + 1) * (SUFFIXES.length + 1);

  return { generate, mulberry32, total, baseTotal };
})();
</script>
<script>
(() => {
  'use strict';

  const timeEl = document.getElementById('time');
  const phraseEl = document.getElementById('phrase');
  const countEl = document.getElementById('count');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  countEl.textContent = `roughly ${(Vague.total / 1e9).toFixed(1)} billion possible phrases. none of them help.`;

  let currentText = '';
  let lastMinute = '';
  let renderId = 0;

  const minuteKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${d.getHours()}-${d.getMinutes()}`;

  function seedFor(d) {
    const s = minuteKey(d);
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
  }

  function fit() {
    const vw = window.innerWidth;
    const narrow = vw < 700;
    const width = Math.min(vw * 0.92, 1400);
    const chars = timeEl.textContent.length;
    const maxSize = narrow ? vw * 0.13 : Math.min(vw * 0.068, 118);
    const lines = narrow ? 3 : 2;
    let size = Math.min(maxSize, (width * lines) / (chars * 0.74));
    size = Math.max(size, narrow ? 22 : 26);
    timeEl.style.fontSize = `${size}px`;
    const maxHeight = window.innerHeight * 0.62;
    let guard = 0;
    while ((timeEl.scrollHeight > maxHeight || timeEl.scrollWidth > width + 1) && size > 16 && guard++ < 40) {
      size *= 0.94;
      timeEl.style.fontSize = `${size}px`;
    }
  }

  function render(text, animate) {
    currentText = text;
    const id = ++renderId;
    const shown = text.replace(/'/g, '\u2019');
    const apply = () => {
      if (id !== renderId) return;
      phraseEl.textContent = shown;
      document.title = `Its: ${shown}`;
      fit();
      timeEl.style.opacity = '1';
    };
    if (animate && !reduced) {
      timeEl.style.opacity = '0';
      setTimeout(apply, 150);
    } else {
      apply();
    }
  }

  function showMinute() {
    const d = new Date();
    lastMinute = minuteKey(d);
    render(Vague.generate(Vague.mulberry32(seedFor(d)), d), false);
  }

  function reroll() {
    const d = new Date();
    let text = currentText;
    for (let i = 0; i < 6 && text === currentText; i++) {
      text = Vague.generate(Vague.mulberry32((Math.random() * 4294967296) >>> 0), d);
    }
    render(text, true);
  }

  function checkMinute() {
    if (minuteKey(new Date()) !== lastMinute) showMinute();
  }

  document.addEventListener('click', reroll);
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof Element && e.target.closest('button')) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      reroll();
    }
  });
  window.addEventListener('resize', fit);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkMinute(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  setInterval(checkMinute, 1000);

  showMinute();
})();
</script>
</body>
